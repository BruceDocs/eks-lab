# Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics + Prometheus Operator
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "75.*"         # pin to a version you've tested
    helm:
      releaseName: kps
      valuesObject:
        fullnameOverride: kps
        prometheus:
          prometheusSpec:
            retention: 3d
            # pick up ServiceMonitors/PodMonitors/Probes/Rules from ALL namespaces
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 10Gi } }
        nodeExporter: { enabled: true }
        grafana:
          adminPassword: admin123     # LAB ONLY - use a secret
          persistence: { enabled: true, storageClassName: gp3, size: 2Gi }
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - { name: default, orgId: 1, folder: "", type: file, disableDeletion: false, editable: true,
                    options: { path: /var/lib/grafana/dashboards/default } }
          dashboards:
            default:
              node-exporter-full: { gnetId: 1860, revision: 37, datasource: Prometheus }
              mysql-overview:     { gnetId: 7362, revision: 5,  datasource: Prometheus }
              jvm-micrometer:     { gnetId: 4701, revision: 10, datasource: Prometheus }
              kafka-exporter:     { gnetId: 7589, revision: 5,  datasource: Prometheus }
              blackbox:           { gnetId: 7587, revision: 3,  datasource: Prometheus }
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
