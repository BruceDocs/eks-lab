apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels: { strimzi.io/cluster: lab-kafka }
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - { id: 0, type: persistent-claim, size: 10Gi, class: gp3, deleteClaim: true }
  resources: { requests: { cpu: 300m, memory: 1Gi }, limits: { memory: 1536Mi } }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: lab-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
      - { name: tls,   port: 9093, type: internal, tls: true }
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    metricsConfig:                      # Kafka JMX -> Prometheus
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef: { name: kafka-metrics, key: kafka-metrics-config.yml }
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:                        # consumer lag / topic metrics
    topicRegex: ".*"
    groupRegex: ".*"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: kafka-metrics, namespace: kafka }
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: "kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value"
        name: kafka_server_$1_$2
        type: GAUGE
        labels: { clientId: "$3", topic: "$4", partition: "$5" }
      - pattern: "kafka.server<type=(.+), name=(.+)><>Value"
        name: kafka_server_$1_$2
        type: GAUGE
      - pattern: "kafka.server<type=(.+), name=(.+)><>Count"
        name: kafka_server_$1_$2_total
        type: COUNTER
      - pattern: "kafka.controller<type=(.+), name=(.+)><>Value"
        name: kafka_controller_$1_$2
        type: GAUGE
      - pattern: "kafka.network<type=(.+), name=(.+)><>Value"
        name: kafka_network_$1_$2
        type: GAUGE
      - pattern: "kafka.log<type=Log, name=(.+), topic=(.+), partition=(.+)><>Value"
        name: kafka_log_log_$1
        type: GAUGE
        labels: { topic: "$2", partition: "$3" }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders
  namespace: kafka
  labels: { strimzi.io/cluster: lab-kafka }
spec:
  partitions: 3
  replicas: 3
  config: { retention.ms: 604800000 }
