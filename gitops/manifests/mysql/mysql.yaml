apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mysql
  labels: { app: mysql }
spec:
  clusterIP: None
  selector: { app: mysql }
  ports:
    - { name: mysql,   port: 3306, targetPort: 3306 }
    - { name: metrics, port: 9104, targetPort: 9104 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql, namespace: mysql }
spec:
  serviceName: mysql
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: mysql-credentials, key: root-password } } }
            - { name: MYSQL_DATABASE, value: ordersdb }
            - { name: MYSQL_USER,     valueFrom: { secretKeyRef: { name: mysql-credentials, key: app-user } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: mysql-credentials, key: app-password } } }
          readinessProbe:
            exec: { command: [sh, -c, 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD"'] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
        - name: mysqld-exporter            # MySQL Exporter sidecar
          image: prom/mysqld-exporter:v0.15.1
          ports: [{ name: metrics, containerPort: 9104 }]
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: mysql-credentials, key: root-password } } }
            # LAB shortcut: uses root. Production: dedicated user (PROCESS, REPLICATION CLIENT, SELECT).
            - { name: DATA_SOURCE_NAME, value: "root:$(MYSQL_ROOT_PASSWORD)@(127.0.0.1:3306)/" }
          resources: { requests: { cpu: 25m, memory: 32Mi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: { requests: { storage: 10Gi } }
